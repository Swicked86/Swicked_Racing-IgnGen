; IgnGen engine profile: Acura B18C1 (DOHC VTEC)
; Used with: igngen new --engine B18C1
; USDM OBD1 era (~1992–1995). Factory SAE peak numbers; timing defaults are IgnGen starters.
; Fitment: 1994–1995 Integra GS-R (OBD1 years; continues OBD2)

[profile]
name = B18C1
description = Acura B18C1 — 1.8L DOHC VTEC (Integra GS-R)

[engine]
displacement_cc = 1797
peak_hp = 170
peak_hp_rpm = 7600
peak_torque_lbft = 128
peak_torque_rpm = 6200
redline_rpm = 8000
; Stock NA — set boost_psi / boost_bar_abs if forced induction
boost_psi = 0
idle_rpm = 750
; 750 ± 50 RPM
idle_pocket_width = 50

[mechanical]
base_timing = 16
mech_timing_at_peak_torque = 36

[vacuum]
; Total timing at full vacuum (≤40 kPa is fixed in code)
vacuum_total_timing = 50

[boost]
; Total timing ° minimum at full boost (edit if forced induction)
boost_timing_limit = 20

[idle]
; Idle MAP band (kPa abs) and ±° stabilization
idle_map_lo = 30
idle_map_hi = 45
idle_pocket_bump = 2

