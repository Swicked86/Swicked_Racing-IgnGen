; IgnGen engine profile: Honda D16Z6 (SOHC VTEC)
; Used with: igngen new --engine D16Z6
; Fills engine / mechanical / pocket inputs so RPM landmarks match this motor.

[profile]
name = D16Z6
description = Honda D16Z6 — 1.6L SOHC VTEC

[engine]
displacement_cc = 1590
peak_hp = 125
peak_hp_rpm = 6600
peak_torque_lbft = 106
peak_torque_rpm = 5200
redline_rpm = 7200
boost_psi = 0
idle_rpm = 670

[mechanical]
base_timing = 16
mech_timing_at_peak_torque = 34

[vacuum]
vacuum_full_map_kpa = 40
vacuum_total_timing = 50

[boost]
boost_timing_limit = 20
boost_retard_deg_per_psi = 2

[idle]
; Idle pocket width is TOTAL RPM span. With the default 25/75 split and a
; 670 RPM target, 100 RPM total spans roughly 645 -> 670 -> 745 RPM.
idle_pocket_width = 100
idle_pocket_lower_share = 0.25
idle_pocket_upper_share = 0.75
; Idle pocket timing is independent of distributor/base timing.
idle_timing_target = 10
idle_timing_delta = 6
; Warm-idle MAP band in kPa absolute. Camshaft/intake/exhaust changes can move
; idle vacuum substantially; measure warm idle MAP and adjust as needed.
idle_map_lo = 30
idle_map_hi = 45

[limiter]
soft_limit_rpm_before_redline = 500
soft_limit_retard = 10
overspeed_rpm_after_redline = 1000
