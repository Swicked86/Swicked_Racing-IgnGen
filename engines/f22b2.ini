; IgnGen engine profile: Honda F22B2 (SOHC)
; Used with: igngen new --engine F22B2
; USDM OBD1 era (~1992–1995). Factory SAE peak numbers; timing defaults are IgnGen starters.
; Fitment: 1994–1995 Accord DX/LX (OBD1 years)

[profile]
name = F22B2
description = Honda F22B2 — 2.2L SOHC (Accord DX/LX)

[engine]
displacement_cc = 2156
peak_hp = 130
peak_hp_rpm = 5300
peak_torque_lbft = 139
peak_torque_rpm = 4200
redline_rpm = 6500
; Stock NA — set boost_psi / boost_bar_abs if forced induction
boost_psi = 0
idle_rpm = 750
; 750 ± 50 RPM
idle_pocket_width = 50

[mechanical]
base_timing = 16
mech_timing_at_peak_torque = 32

[vacuum]
; Total timing at full vacuum (≤40 kPa is fixed in code)
vacuum_total_timing = 50

[boost]
; Total timing ° minimum at full boost (edit if forced induction)
boost_timing_limit = 20

[idle]
; Idle MAP band (kPa abs) and ±° stabilization
idle_map_lo = 30
idle_map_hi = 45
idle_pocket_bump = 2

