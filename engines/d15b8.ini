; IgnGen engine profile: Honda D15B8 (SOHC 8-valve)
; Used with: igngen new --engine D15B8
; USDM OBD1 era (~1992–1995). Factory SAE peak numbers; timing defaults are IgnGen starters.
; Fitment: 1992–1995 Civic CX

[profile]
name = D15B8
description = Honda D15B8 — 1.5L SOHC 8V (Civic CX)

[engine]
displacement_cc = 1493
peak_hp = 70
peak_hp_rpm = 5000
peak_torque_lbft = 91
peak_torque_rpm = 2000
redline_rpm = 6500
; Stock NA — set boost_psi / boost_bar_abs if forced induction
boost_psi = 0
idle_rpm = 750
; 750 ± 50 RPM
idle_pocket_width = 50

[mechanical]
base_timing = 16
mech_timing_at_peak_torque = 30

[vacuum]
; Total timing at full vacuum (≤40 kPa is fixed in code)
vacuum_total_timing = 50

[boost]
; Total timing ° minimum at full boost (edit if forced induction)
boost_timing_limit = 20

[idle]
; Idle MAP band (kPa abs) and ±° stabilization
idle_map_lo = 30
idle_map_hi = 45
idle_pocket_bump = 2

