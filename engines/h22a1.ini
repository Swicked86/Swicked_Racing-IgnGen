; IgnGen engine profile: Honda H22A1 (DOHC VTEC)
; Used with: igngen new --engine H22A1
; USDM OBD1 era (~1992–1995). Factory SAE peak numbers; timing defaults are IgnGen starters.
; Fitment: 1993–1996 Prelude VTEC (USDM)

[profile]
name = H22A1
description = Honda H22A1 — 2.2L DOHC VTEC (Prelude VTEC)

[engine]
displacement_cc = 2157
peak_hp = 190
peak_hp_rpm = 6800
peak_torque_lbft = 158
peak_torque_rpm = 5500
redline_rpm = 7500
; Stock NA — set boost_psi / boost_bar_abs if forced induction
boost_psi = 0
idle_rpm = 750
; 750 ± 50 RPM
idle_pocket_width = 50

[mechanical]
base_timing = 16
mech_timing_at_peak_torque = 36

[vacuum]
; Total timing at full vacuum (≤40 kPa is fixed in code)
vacuum_total_timing = 50

[boost]
; Total timing ° minimum at full boost (edit if forced induction)
boost_timing_limit = 20

[idle]
; Idle MAP band (kPa abs) and ±° stabilization
idle_map_lo = 30
idle_map_hi = 45
idle_pocket_bump = 2

