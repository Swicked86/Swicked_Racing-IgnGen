; IgnGen engine profile: Toyota 4A-GE
; Used with: igngen new --engine 4age
; Original IgnGen default research motor numbers.

[profile]
name = 4AGE
description = Toyota 4A-GE — original IgnGen default research profile (1.6L)

[engine]
displacement_cc = 1600
peak_hp = 280
peak_hp_rpm = 7800
peak_torque_lbft = 189
peak_torque_rpm = 4800
redline_rpm = 9300
boost_psi = 12
idle_rpm = 1100

[mechanical]
base_timing = 10
mech_timing_at_peak_torque = 36

[vacuum]
; Full vacuum timing target and the MAP where the vacuum mechanism is considered fully in.
vacuum_full_map_kpa = 40
vacuum_total_timing = 50

[boost]
; Absolute total timing limit under boost. IgnGen calculates the required retard.
boost_timing_limit = 20
; Default turbo profile gain. Uses the vacuum kPa curve mirrored above 100 kPa,
; but brings the configured boost timing limit in more slowly than a 1:1 mirror.
boost_retard_gain = 0.60
; Legacy/reference-only heuristic; V2 does not use this to generate timing.
boost_retard_deg_per_psi = 2

[idle]
; Idle pocket width is TOTAL RPM span. Default 25/75 split gives a short catch
; region below target idle and a longer torque-removal region above it.
idle_pocket_width = 100
idle_pocket_lower_share = 0.25
idle_pocket_upper_share = 0.75
; Pocket timing is target +/- delta and is independent of base/distributor timing.
idle_timing_target = 10
idle_timing_delta = 6
; Warm-idle MAP band (kPa absolute). A camshaft or breathing change can move
; idle vacuum substantially; measure the engine and edit these values as needed.
idle_map_lo = 30
idle_map_hi = 45

[limiter]
soft_limit_rpm_before_redline = 500
soft_limit_retard = 10
overspeed_rpm_after_redline = 1000
