; IgnGen engine profile: Toyota 4A-GE
; Used with: igngen new --engine 4age
; Original IgnGen default research motor numbers.

[profile]
name = 4AGE
description = Toyota 4A-GE — original IgnGen default research profile (1.6L)

[engine]
displacement_cc = 1600
peak_hp = 280
peak_hp_rpm = 7800
peak_torque_lbft = 189
peak_torque_rpm = 4800
redline_rpm = 9300
boost_psi = 0
idle_rpm = 1100
idle_pocket_width = 125

[mechanical]
base_timing = 10
mech_timing_at_peak_torque = 32

[vacuum]
; Total timing at full vacuum (≤40 kPa is fixed in code)
vacuum_total_timing = 50

[boost]
; Total timing ° minimum at full boost
boost_timing_limit = 20

[idle]
; Idle MAP band (kPa abs) and ±° stabilization
idle_map_lo = 30
idle_map_hi = 45
idle_pocket_bump = 2
