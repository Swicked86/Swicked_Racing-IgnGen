; IgnGen engine profile: Acura B17A1 (DOHC VTEC)
; Used with: igngen new --engine B17A1
; USDM OBD1 era (~1992–1995). Factory SAE peak numbers; timing defaults are IgnGen starters.
; Fitment: 1992–1993 Integra GS-R

[profile]
name = B17A1
description = Acura B17A1 — 1.7L DOHC VTEC (Integra GS-R)

[engine]
displacement_cc = 1678
peak_hp = 160
peak_hp_rpm = 7600
peak_torque_lbft = 117
peak_torque_rpm = 7000
redline_rpm = 8000
boost_psi = 0
idle_rpm = 750

[mechanical]
base_timing = 16
mech_timing_at_peak_torque = 36

[vacuum]
vacuum_full_map_kpa = 40
vacuum_total_timing = 50

[boost]
boost_timing_limit = 20
boost_retard_gain = 0.6
boost_retard_deg_per_psi = 2

[idle]
; Idle pocket width is TOTAL RPM span. Default 25/75 split = 25 RPM below and
; 75 RPM above a 750 RPM target when width is 100.
idle_pocket_width = 100
idle_pocket_lower_share = 0.25
idle_pocket_upper_share = 0.75
; Idle pocket timing is independent of distributor/base timing.
idle_timing_target = 10
idle_timing_delta = 6
; Warm-idle MAP band in kPa absolute. Camshaft/intake/exhaust changes can move
; idle vacuum substantially; measure warm idle MAP and adjust as needed.
idle_map_lo = 30
idle_map_hi = 45

[limiter]
soft_limit_rpm_before_redline = 500
soft_limit_retard = 10
overspeed_rpm_after_redline = 1000
