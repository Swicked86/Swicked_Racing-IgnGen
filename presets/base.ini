; IgnGen preset: base (Swicked research default)
; If this file is present, output format is taken from here — no CLI prompts for layout/export.

[preset]
name = base
load_unit = kPa
origin = top_left
axes = generated

[output]
layout = alpha
export = alpha
include_headers = true
delimiter = comma
decimal_places = 0
# Top-left / ALPHAlink-style view: RPM ↓ rows, Load → columns.
# Axes stay generated kPa (not alpha’s fixed inHg table).

[table]
rpm_count = 16
load_count = 12
