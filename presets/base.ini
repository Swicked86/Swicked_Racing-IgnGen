; IgnGen preset: base (Swicked research default)
; If this file is present, output format is taken from here — no CLI prompts for layout/export.

[preset]
name = base
load_unit = kPa
origin = bottom_left
axes = generated

[output]
layout = swicked
export = swicked
include_headers = true
delimiter = comma
decimal_places = 0
# Base map origin is bottom-left (RPM right, load up)

[table]
rpm_count = 16
load_count = 12
