; IgnGen preset: base (Swicked research default)
; If this file is present, output format is taken from here — no CLI prompts for layout/export.

[preset]
name = base
load_unit = kPa
origin = bottom_left
axes = generated

[output]
layout = swicked
export = swicked
include_headers = true
delimiter = comma
decimal_places = 0
# Terminal/CSV: load low→high top-to-bottom; origin bottom-left cell is
# min RPM × min load (first data column, last data row when viewed with Load↑
# in a GUI that draws Y upward — terminal prints low load first for readability).

[table]
rpm_count = 16
load_count = 12
