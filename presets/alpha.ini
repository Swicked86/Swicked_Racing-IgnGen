; IgnGen preset: alpha (ALPHAlink-style view)
; Axes are GENERATED from the engine (cranking, idle pocket, 2:1 RPM budget, load landmarks).
; View/export stay ALPHAlink: top-left, RPM ↓, Load →, inHg gauge (0 ≈ atm).

[preset]
name = alpha
load_unit = inHg
origin = top_left
axes = generated

[output]
layout = alpha
export = alpha
include_headers = true
delimiter = comma
decimal_places = 0

[table]
rpm_count = 20
load_count = 16
