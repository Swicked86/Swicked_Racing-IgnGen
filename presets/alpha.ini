; IgnGen preset: alpha (ALPHAlink-compatible)
; If this file is present, output format is taken from here — no CLI prompts for layout/export.

[preset]
name = alpha
load_unit = inHg
origin = top_left
axes = fixed

[output]
layout = alpha
export = alpha
include_headers = true
delimiter = comma
decimal_places = 0
# Alpha map origin is top-left (RPM down, load right)

[table]
rows = 20
cols = 16
