; IgnGen vehicle profile: Honda D16Z6 (SOHC VTEC)
; Used with: igngen new --engine D16Z6
; Fills engine / mechanical / pocket inputs so RPM landmarks match this motor.

[vehicle]
name = D16Z6
description = Honda D16Z6 — 1.6L SOHC VTEC

[engine]
displacement_cc = 1590
peak_hp = 125
peak_hp_rpm = 6600
peak_torque_lbft = 106
peak_torque_rpm = 5200
redline_rpm = 7200
; Stock NA — set boost_psi / boost_bar_abs if forced induction
boost_psi = 0
idle_rpm = 670
; 670 ± 50 RPM
idle_pocket_width = 50

[mechanical]
base_timing = 16
mech_timing_at_peak_torque = 34

[vacuum]
; Total timing at full vacuum (≤40 kPa is fixed in code)
vacuum_total_timing = 50

[boost]
; Total timing ° minimum at full boost
boost_timing_limit = 20

[idle]
; Idle MAP band (kPa abs) and ±° stabilization
idle_map_lo = 30
idle_map_hi = 45
idle_pocket_bump = 2
